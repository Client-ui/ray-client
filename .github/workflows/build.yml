
name: Build Ray Client 1.6

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Ray Client
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload Minecraft JAR
        uses: actions/upload-artifact@v4
        with:
          name: ray-client-1.6-minecraft-1.21.11
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
